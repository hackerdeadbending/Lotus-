name: Build Lotus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and install-test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          adb version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Test installation and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n app.lotus/.MainActivity
            sleep 3
            adb shell pidof app.lotus

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lotus ${{ github.run_number }}
          body: "Lotus Android UI prototype. This build passed APK structure/signature checks and an Android 13 emulator install/launch test. End-to-end encryption and message delivery are not implemented yet."
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
