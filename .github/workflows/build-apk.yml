name: Build Lotus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n24333f8a63b6825ea9c5514fbe79abe4ecdde9ab" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n84831b9409646161bbf6b63b7f1c5a37f675e6f7" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Create Gradle Wrapper if needed
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: find app/build/outputs -name "*.apk" || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Lotus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lotus ${{ github.run_number }}
          body: "Скачай app-debug.apk и установи на телефон"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
